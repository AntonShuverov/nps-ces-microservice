<!doctype html>
<!-- Экран сайта внутри прототипа. Примеры опросов повторяют backend/src/main/resources/db/seed/R__example_surveys.sql -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap">
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; background: #f2f5f8; font-family: "Mazzard M", Montserrat, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111e2b; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: #fff; border-bottom: 1px solid #e3e9ef; font-size: 14px; }
  .bar b { font-weight: 500; }
  .bar span { color: #657f95; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; }
  .status { display: inline-block; padding: 4px 10px; border-radius: 999px; background: #e6f4ea; color: #1d6b34; font-size: 13px; }
  h1 { margin: 12px 0 6px; font-size: 24px; font-weight: 500; }
  p { margin: 0; color: #3c546b; line-height: 1.5; }
  .rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
  .rows div { padding: 12px; border-radius: 10px; background: #f2f5f8; font-size: 13px; color: #657f95; }
  .rows b { display: block; margin-top: 4px; font-size: 16px; font-weight: 500; color: #111e2b; }
</style>
</head>
<body>
<div class="bar"><b>Личный кабинет</b><span>Константин К.</span></div>
<main>
  <div class="card">
    <span class="status" id="status">Займ погашен</span>
    <h1 id="headline">Спасибо, займ закрыт</h1>
    <p id="lead">Платеж получен, задолженности нет.</p>
    <div class="rows">
      <div>Сумма<b>10 000 ₽</b></div>
      <div>Вернуть<b>11 200 ₽</b></div>
      <div>Дата возврата<b>30.11.2026</b></div>
    </div>
  </div>
</main>
<script>
// Заглушка сервиса опросов: те же опросы, что в backend/src/main/resources/db/seed/R__example_surveys.sql
const COMMENT = (code, text, q, max) => ({ id: 0, code, type: 'TEXT', text, required: false,
  settings: { placeholder: 'Ваш комментарий здесь', maxLength: 1000, showIf: { question: q, op: 'lte', value: max } } });
const CES = (text) => ({ id: 0, code: 'ces', type: 'SCALE', text, required: true, settings: { min: 1, max: 5, view: 'emoji' } });
const SURVEYS = {
  loan_repaid: { surveyId: 1, code: 'nps_ces_loan_repaid', title: 'Пройдите опрос', steps: [
    { step: 1, questions: [
      { id: 0, code: 'nps', type: 'SCALE', text: 'Насколько вероятно, что вы порекомендуете наш сервис?', required: true, settings: { min: 1, max: 10 } },
      COMMENT('nps_comment', 'Посоветуйте, что можно сделать лучше', 'nps', 6) ] },
    { step: 2, questions: [ CES('Насколько легко оплатить займ в Личном кабинете?'),
      COMMENT('ces_comment', 'С какими трудностями вы столкнулись при оплате?', 'ces', 3) ] } ] },
  loan_issued: { surveyId: 3, code: 'ces_loan_issued', title: 'Пройдите опрос', steps: [
    { step: 1, questions: [ CES('Насколько легко было получить займ?'),
      COMMENT('ces_comment', 'С какими трудностями вы столкнулись?', 'ces', 3) ] } ] },
  application_submitted: { surveyId: 2, code: 'ces_application_submitted', title: 'Пройдите опрос', steps: [
    { step: 1, questions: [ CES('Насколько легко было оформить заявку?'),
      COMMENT('ces_comment', 'С какими трудностями вы столкнулись?', 'ces', 3) ] } ] },
};
let nextId = 10;
Object.values(SURVEYS).forEach(s => s.steps.forEach(st => st.questions.forEach(q => { q.id = nextId++; })));
const impressions = {};
let impressionSeq = 1;
const report = (entry) => parent.postMessage({ source: 'survey-preview', ...entry }, '*');
const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });

window.fetch = async (url, init = {}) => {
  const method = init.method || 'GET';
  const body = init.body ? JSON.parse(init.body) : undefined;
  const path = String(url).replace('/api/v1/surveys', '');
  let response;
  if (path.startsWith('/active')) {
    const step = new URLSearchParams(path.split('?')[1]).get('flowStep');
    response = SURVEYS[step] ? json(SURVEYS[step]) : new Response(null, { status: 204 });
  } else if (path === '/impressions') {
    const id = 'demo-' + impressionSeq++;
    impressions[id] = Object.values(SURVEYS).find(s => s.surveyId === body.surveyId);
    response = json({ impressionId: id }, 201);
  } else if (path.includes('/steps/')) {
    const [, id, step] = path.match(/impressions\/([^/]+)\/steps\/(\d+)/);
    const last = impressions[id].steps.length;
    const completed = Number(step) === last;
    response = json({ status: completed ? 'COMPLETED' : 'SHOWN', lastStep: Number(step), completed });
  } else if (path.endsWith('/close')) {
    response = new Response(null, { status: 204 });
  } else {
    response = new Response(null, { status: 404 });
  }
  const labels = {};
  Object.values(SURVEYS).forEach(s => s.steps.forEach(st => st.questions.forEach(q => { labels[q.id] = q.code; })));
  report({ method, path, body, status: response.status, labels });
  await new Promise(r => setTimeout(r, 150));
  return response;
};

const SCREENS = {
  loan_issued: ['Займ выдан', 'Деньги отправлены на карту', 'Обычно деньги приходят в течение нескольких минут.'],
  application_submitted: ['Заявка отправлена', 'Заявка на рассмотрении', 'Решение придет в СМС и появится в личном кабинете.'],
  loan_repaid: ['Займ погашен', 'Спасибо, займ закрыт', 'Платеж получен, задолженности нет.'],
};
window.addEventListener('message', (event) => {
  if (!event.data || event.data.source !== 'survey-preview-control') return;
  const step = event.data.flowStep;
  const [status, headline, lead] = SCREENS[step];
  document.getElementById('status').textContent = status;
  document.getElementById('headline').textContent = headline;
  document.getElementById('lead').textContent = lead;
  document.querySelectorAll('[data-survey-widget]').forEach(n => n.remove());
  SurveyWidget.resetSurveyVisit();
  SurveyWidget.showSurvey(step);
});
</script>
<script>/*BUNDLE*/</script>
<script>SurveyWidget.initSurveys({ delayMs: 500, thankYouAutoCloseMs: 0 }); parent.postMessage({ source: 'survey-preview', ready: true }, '*');</script>
</body>
</html>
