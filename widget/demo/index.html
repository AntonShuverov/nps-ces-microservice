<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Демо опросов NPS CES</title>
  <style>
    body { margin: 0; padding: 24px 16px; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f4f6; color: #111827; }
    main { max-width: 640px; margin: 0 auto; }
    .card { padding: 24px; border-radius: 16px; background: #fff; margin-bottom: 16px; }
    label { display: block; margin-bottom: 12px; }
    input { padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; font: inherit; }
    button { margin: 4px 8px 4px 0; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    .note { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Займ выдан</h1>
    <p class="note">Демо-страница. В проде ID клиента выставляет API gateway, здесь он передается заголовком вручную.</p>
    <label>ID клиента <input id="client" value="demo-client-1"></label>
    <label>ID займа <input id="loan" value="loan-1"></label>
  </div>
  <div class="card">
    <p>Сымитировать событие флоу:</p>
    <button data-step="application_submitted">Заявка отправлена</button>
    <button data-step="loan_issued">Займ выдан</button>
    <button data-step="loan_repaid">Займ погашен</button>
  </div>
</main>
<script type="module">
  import { initSurveys, resetSurveyVisit, showSurvey } from '../src/index.ts';

  initSurveys({
    delayMs: 500,
    headers: () => ({ 'X-Client-Id': document.getElementById('client').value }),
  });

  document.querySelectorAll('[data-step]').forEach((button) => {
    button.addEventListener('click', () => {
      resetSurveyVisit();
      showSurvey(button.dataset.step, { eventObjectId: document.getElementById('loan').value });
    });
  });
</script>
</body>
</html>
