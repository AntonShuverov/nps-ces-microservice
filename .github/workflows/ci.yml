name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # PostgreSQL для интеграционных тестов поднимается через Testcontainers
      - run: mvn -B -ntp verify

  widget:
    name: Widget tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run prototype
      # Готовый прототип хранится в репозитории: проверяем, что его пересобрали после изменений виджета
      - name: Prototype is up to date
        run: git diff --exit-code -- ../nps-ces-prototype.html || (echo "Пересоберите прототип: cd widget && npm run prototype" && exit 1)

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t survey-service:ci backend
