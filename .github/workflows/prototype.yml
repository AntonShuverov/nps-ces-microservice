name: Prototype

# Публикует интерактивный прототип опросов на GitHub Pages при изменениях виджета в main.
# Один раз нужно включить Pages: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'widget/**'
      - '.github/workflows/prototype.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run prototype
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: widget/dist/prototype
      - id: deployment
        uses: actions/deploy-pages@v4
